<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vegan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vegan">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: one-hand phone app — sticky white top bar with wordmark, big left-aligned page titles, orange pill actions, fixed bottom tab bar */
:root{
  --bg:#ffffff;
  --surface:#f1f4f9;
  --surface-2:#e3e9f2;
  --line:#e0e6ef;
  --fg:#0b2352;
  --navy:#0b2352;
  --navy-soft:#e8edf6;
  --muted:#5b6a85;
  --brand:#f26300;
  --brand-press:#d95700;
  --brand-ink:#ffffff;
  --brand-soft:#fff1e6;
  --ok:#13804a; --ok-soft:#e5f3ea; --ok-ink:#0d5d36;
  --bad:#c8212f; --bad-soft:#fce8ea; --bad-ink:#9c1824;
  --warn:#b16f00; --warn-soft:#fff2d6; --warn-ink:#7f5000;
  --unk:#5b6a85; --unk-soft:#eef1f6;
  --shadow:0 1px 2px rgba(11,35,82,.06),0 4px 14px rgba(11,35,82,.07);
  --font:"Figtree",ui-rounded,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wordmark{font-weight:900;font-size:27px;letter-spacing:-.04em;color:var(--brand);line-height:1;display:flex;align-items:baseline;gap:1px}
.wordmark i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin-left:2px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--navy-soft);display:grid;place-items:center;color:var(--navy)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(104px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}
h1{font-size:30px;font-weight:900;letter-spacing:-.025em;line-height:1.1;margin:4px 0 2px;text-wrap:balance}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
.label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;border:0;font-weight:800;font-size:16.5px;background:var(--brand);color:var(--brand-ink);text-decoration:none;user-select:none}
.btn:active{background:var(--brand-press)}
.btn[disabled]{opacity:.55}
.btn.block{width:100%}
.btn.ghost{background:var(--navy-soft);color:var(--navy)}
.btn.ghost:active{background:var(--surface-2)}
.btn.outline{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.btn svg{width:21px;height:21px;flex:none}
.btn.small{min-height:40px;padding:0 16px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

.field{background:var(--surface);border-radius:var(--r-md);border:2px solid transparent;transition:border-color .15s}
.field:focus-within{border-color:var(--brand)}
textarea.input,input.input{width:100%;border:0;background:transparent;padding:14px 16px;resize:vertical;outline:none;font-size:16px;line-height:1.5;min-width:0}
textarea.input{min-height:132px;display:block}
.input-row{display:flex;align-items:center;gap:8px;padding-right:6px}
.input-row .btn{min-height:42px;padding:0 18px}

/* Verdict */
.verdict{border-radius:var(--r-lg);padding:20px 20px 18px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.verdict .word{font-size:36px;font-weight:900;letter-spacing:-.03em;line-height:1.02;display:flex;align-items:center;gap:12px}
.verdict .word svg{width:34px;height:34px;flex:none}
.verdict .sub{font-size:16px;font-weight:600}
.verdict.ok{background:var(--ok);color:#fff}
.verdict.bad{background:var(--bad);color:#fff}
.verdict.warn{background:var(--warn);color:#fff}
.verdict.unk{background:var(--surface-2);color:var(--fg)}
.verdict .pct{font-variant-numeric:tabular-nums}
.culprits{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.culprits span{background:rgba(255,255,255,.22);border-radius:999px;padding:4px 11px;font-weight:700;font-size:14.5px}

.disclosure{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:var(--surface);border-radius:var(--r-md);padding:14px 16px;font-weight:800;font-size:16px;text-align:left}
.disclosure .count{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.disclosure svg{width:20px;height:20px;transition:transform .2s;flex:none}
.disclosure[aria-expanded="true"] svg{transform:rotate(180deg)}

.ilist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.ilist li+li{border-top:1px solid var(--line)}
.irow{width:100%;display:flex;align-items:center;gap:12px;background:var(--bg);border:0;padding:12px 14px;text-align:left;min-height:52px}
.irow .dot{width:12px;height:12px;border-radius:50%;flex:none}
.irow .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.irow .tag{font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;flex:none;font-variant-numeric:tabular-nums}
.irow.A{background:var(--bad-soft)} .irow.A .dot{background:var(--bad)} .irow.A .tag{color:var(--bad-ink);background:var(--bg)}
.irow.U{background:var(--warn-soft)} .irow.U .dot{background:var(--warn)} .irow.U .tag{color:var(--warn-ink);background:var(--bg)}
.irow.V .dot{background:var(--ok)} .irow.V .tag{display:none}
.irow.X{background:var(--unk-soft)} .irow.X .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--unk)} .irow.X .tag{color:var(--muted);background:var(--bg)}
.detail{padding:4px 14px 14px 38px;font-size:14.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.irow.A + .detail{background:var(--bad-soft)} .irow.U + .detail{background:var(--warn-soft)} .irow.X + .detail{background:var(--unk-soft)}
.detail b{color:var(--fg);font-weight:700}
.group-h{padding:10px 14px 6px;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg)}

/* Scan */
.scanhero{background:var(--brand-soft);border-radius:var(--r-lg);padding:26px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.scanbtn{width:132px;height:132px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(242,99,0,.32);position:relative}
.scanbtn:active{background:var(--brand-press);transform:scale(.98)}
.scanbtn svg{width:60px;height:60px}
.scanbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.scanhero .t{font-weight:900;font-size:21px;letter-spacing:-.01em}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card .meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pitem{width:100%;display:flex;align-items:center;gap:12px;border:0;background:var(--surface);border-radius:var(--r-md);padding:12px 14px;text-align:left}
.pitem .badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.pitem .badge svg{width:22px;height:22px}
.pitem .badge.ok{background:var(--ok);color:#fff} .pitem .badge.bad{background:var(--bad);color:#fff} .pitem .badge.warn{background:var(--warn);color:#fff}
.pitem .tx{flex:1;min-width:0}
.pitem .tx b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .tx span{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.status{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--muted);padding:6px 2px}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--brand);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--bad-soft);color:var(--bad-ink);border-radius:var(--r-md);padding:12px 14px;font-weight:600}

/* Recipe */
.rhead{display:flex;flex-direction:column;gap:6px}
.rtitle{font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1.12;margin:0;text-wrap:balance}
.banner{border-radius:var(--r-md);padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center}
.banner svg{width:22px;height:22px;flex:none}
.banner.ok{background:var(--ok-soft);color:var(--ok-ink)}
.banner.brand{background:var(--brand-soft);color:var(--fg)}
.banner.brand svg{color:var(--brand)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:999px;padding:5px 5px 5px 18px}
.stepper .lbl{font-weight:700}
.stepper .ctl{display:flex;align-items:center;gap:4px}
.stepper button{width:42px;height:42px;border-radius:50%;border:0;background:var(--navy);font-size:22px;font-weight:800;display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
.stepper output{min-width:34px;text-align:center;font-weight:900;font-size:19px;font-variant-numeric:tabular-nums}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rlist li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.rlist li.sh{border:0;padding:16px 0 4px;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.rlist .amt{flex:0 0 92px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rlist .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.rlist li.sub{background:var(--brand-soft);border-radius:var(--r-sm);padding:10px 12px;margin:4px 0;border-bottom:0}
.rlist li.sub .nm{display:flex;flex-direction:column;gap:2px}
.rlist .parts{display:flex;flex-direction:column;gap:3px}
.rlist .parts div{display:flex;gap:12px}
.rlist .parts .amt{flex:0 0 auto;min-width:80px}
.rlist .was{font-size:13.5px;color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.rlist .why{font-size:13.5px;color:var(--muted)}
.leaf{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--brand)}
.leaf svg{width:14px;height:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
.steps li.mod::before{background:var(--navy);color:#fff}
.steps li.pre::before{content:"↻";background:var(--navy);color:#fff}
.steps li div{flex:1;min-width:0;padding-top:3px}
.steps mark{background:transparent;color:var(--brand);font-weight:800}
.removed{color:var(--bad-ink);background:var(--bad-soft)!important}

/* Bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(11,35,82,.05);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;color:var(--muted);font-weight:700;font-size:12.5px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--navy)}
.tab[aria-current="page"] .pill{background:var(--navy-soft)}
.tab .pill{border-radius:999px;padding:3px 18px;display:grid;place-items:center}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(15,10,5,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:22px 22px 0 0;padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--surface-2);margin:0 auto 4px}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.glist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.glist li{background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.glist li span:last-child{color:var(--muted);flex:none}
.empty{color:var(--muted);font-size:15px}
.cam{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:relative;width:min(78vw,340px);aspect-ratio:16/9;max-width:100%;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);border:3px solid #fff}
.cam .frame::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--brand);box-shadow:0 0 12px var(--brand)}
.cam .close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--navy);display:grid;place-items:center}
.cam .close svg{width:22px;height:22px}
.cam .hint{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-weight:800;font-size:18px}
.src{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="topbar"><div class="topbar-in">
  <div class="wordmark" aria-label="Vegan">vegan<i></i></div>
  <button class="iconbtn" id="moreBtn" aria-label="Tuotteet ja ylläpito"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
</div></header>

<main>
  <!-- SCAN -->
  <section class="view" id="v-skannaa" hidden>
    <h1>Skannaa</h1>
    <div class="scanhero">
      <label class="scanbtn" aria-label="Kuvaa viivakoodi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg>
        <input type="file" accept="image/*" capture="environment" id="barcodeInput">
      </label>
      <div class="t">Kuvaa viivakoodi</div>
    </div>
    <div class="field input-row">
      <input class="input" id="eanInput" inputmode="numeric" autocomplete="off" aria-label="Viivakoodin numero" maxlength="14">
      <button class="btn" id="eanBtn">Hae</button>
    </div>
    <div id="scanOut" class="view"></div>
    <div class="view" id="recentWrap">
      <h2>Skannatut tuotteet</h2>
      <ul class="plist" id="recent"></ul>
    </div>
  </section>

  <!-- INGREDIENTS -->
  <section class="view" id="v-ainesosat" hidden>
    <h1>Ainesosat</h1>
    <div class="field"><textarea class="input" id="ingInput" aria-label="Ainesosaluettelo" spellcheck="false" autocapitalize="off"></textarea></div>
    <div class="row">
      <label class="btn ghost filebtn" id="ocrBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1.4-2h6.2l1.4 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
        Kuvaa pakkaus
        <input type="file" accept="image/*" capture="environment" id="ocrInput">
      </label>
      <button class="btn ghost" id="clearIng">Tyhjennä</button>
    </div>
    <div id="ocrStatus"></div>
    <div id="checkOut" class="view"></div>
  </section>

  <!-- RECIPE -->
  <section class="view" id="v-resepti" hidden>
    <h1>Resepti</h1>
    <div id="recipeEdit" class="view">
      <div class="field"><textarea class="input" id="recipeInput" aria-label="Resepti" style="min-height:300px"></textarea></div>
      <button class="btn block" id="convertBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 6-14 15-14-1 9-6 15-14 15"/><path d="M5 19l7-7"/></svg>
        Muunna vegaaniseksi
      </button>
    </div>
    <div id="recipeOut" class="view" hidden></div>
  </section>
</main>

<nav class="tabbar" aria-label="Päävalikko"><div class="tabbar-in">
  <button class="tab" data-tab="skannaa"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg></span>Skannaa</button>
  <button class="tab" data-tab="ainesosat"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg></span>Ainesosat</button>
  <button class="tab" data-tab="resepti"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v2a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M2 11h20"/><path d="M9 7c0-1.5 1-2 1-3.5M14 7c0-1.5 1-2 1-3.5"/></svg></span>Resepti</button>
</div></nav>

<div class="cam" id="cam" hidden>
  <video id="camVideo" playsinline muted autoplay></video>
  <div class="frame"></div>
  <div class="hint">Kohdista viivakoodi kehykseen</div>
  <button class="close" id="camClose" aria-label="Sulje kamera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div class="scrim" id="sheet" hidden>

function normTerm(s){
  return String(s).toLowerCase().normalize('NFC')
    .replace(/[*®™†‡]/g,'')
    .replace(/\b(luomu|organic|bio|eko)\b/g,' ')
    .replace(/\be\s*-?\s*(\d{3,4})\s*([a-f])?(?![a-zåäö])/g,(m,d,l)=>'e'+d+(l||''))
    .replace(/[’`´]/g,"'")
    .replace(/^[\s.:;,\-–]+|[\s.:;,\-–]+$/g,'')
    .replace(/\s+/g,' ').trim();
}
function parseP(str){
  const out={}; const parts=String(str).split(';');
  out.default=parseFloat(parts[0])||0.5;
  for(const p of parts.slice(1)){const [k,v]=p.split('=');if(k&&v)out[k.trim()]=parseFloat(v);}
  return out;
}
function addEntry(e){
  e.id=ENTRIES.length; ENTRIES.push(e);
  for(const t of e.terms){const n=normTerm(t); if(!n)continue; const prev=MAP.get(n); if(!prev||rank(e)>rank(prev)) MAP.set(n,e);}

function worst(list){
  let best=null;
  for(const e of list){ if(!e)continue;
    if(!best||rank(e)>rank(best)) best=e;
    else if(rank(e)===rank(best)&&e.cls==='U'&&pDefault(e)<pDefault(best)) best=e;
  }
  return best;
}
function pDefault(e){return e.p?e.p.default:1}
const SUFFIXES=['ttä','tta','iä','ia','jä','ja','tä','ta','ä','a','n','t'];
function lookupVariants(n){
  let e=MAP.get(n); if(e) return e;
  for(const s of SUFFIXES){ if(n.length>s.length+3&&n.endsWith(s)){ e=MAP.get(n.slice(0,-s.length)); if(e) return e; } }
  return null;
}
function classifyWord(w){
  let e=lookupVariants(w); if(e) return e;
  for(const p of PLANT_PRE){ if(w.startsWith(p)&&w.length>p.length+2){ const rest=w.slice(p.length).replace(/^[-n]/,''); if(DAIRY_HEAD.some(h=>rest.startsWith(h))) return PLANT_ENTRY; } }
  if(w.length<6) return null;
  // Yhdyssana: kaksi tunnettua osaa
  for(let i=3;i<=w.length-3;i++){
    const a=w.slice(0,i), b=w.slice(i);
    const ea=MAP.get(a), eb=lookupVariants(b);
    if(ea&&eb) return worst([ea,eb]);
  }
  // Pääsana lopussa
  let head=null;
  for(const t of SINGLE_TERMS){ if(t.length>=4&&w.length>t.length&&w.endsWith(t)&&(!head||t.length>head.length)) head=t; }
  // Eläinperäinen määriteosa alussa
  let mod=null;
  let longestPre=null;
  for(const t of SINGLE_TERMS){
    if(w.length>t.length+2&&w.startsWith(t)){
      if(!longestPre||t.length>longestPre.length) longestPre=t;
      const en=MAP.get(t); if(en.cls==='A'&&t.length>=4&&(!mod||t.length>mod.length)) mod=t;
    }
  }
  if(mod&&longestPre&&longestPre.length>mod.length&&MAP.get(longestPre).cls==='V') mod=null;
  const res=[]; if(head) res.push(MAP.get(head)); if(mod) res.push(MAP.get(mod));
  return res.length?worst(res):null;
}
function classifyTerm(raw){
  const n=normTerm(raw); if(!n) return null;
  if(/^(vegaani|vegaaninen|vegan|kasvipohjainen|plant-based|plant based|maidoton|dairy-free|munaton|egg-free)\b/.test(n)) return PLANT_ENTRY;
  let e=lookupVariants(n); if(e) return e;
  if(/^e\d{3,4}[a-f]?$/.test(n)){ e=MAP.get(n.replace(/[a-f]$/,'')); return e||null; }
  const words=n.split(/[\s\/]+/).filter(Boolean);
  if(words.length>1){
    // kasvipohjainen + maitotuote (esim. oat milk)
    if(PLANT_PRE.includes(words[0])&&DAIRY_HEAD.some(h=>words[1].startsWith(h))) return PLANT_ENTRY;
    const found=[];
    for(let len=Math.min(4,words.length-1);len>=1;len--){
      for(let i=0;i+len<=words.length;i++){
        const ph=words.slice(i,i+len).join(' ');
        const m=lookupVariants(ph); if(m) found.push(m);
      }
      if(found.length) break;
    }
    if(!found.length){ for(const w of words){ const m=classifyWord(w); if(m) found.push(m); } }
    else { for(const w of words){ const m=classifyWord(w); if(m&&m.cls==='A') found.push(m); } }
    return found.length?worst(found):null;
  }
  return classifyWord(n);
}

function splitTop(s){
  const out=[]; let depth=0, cur='';
  for(const ch of s){
    if('([{'.includes(ch)) depth++;
    if(')]}'.includes(ch)) depth=Math.max(0,depth-1);
    if(depth===0&&(ch===','||ch===';'||ch==='\n'||ch==='•')){ out.push(cur); cur=''; continue; }
    cur+=ch;
  }
  out.push(cur);
  const res=[];
  for(const p of out){
    // " ja " / " and " jakaa, mutta ei "mono- ja diglyseridit"
    const pieces=p.split(/\s+(?:ja|sekä|and|&)\s+/i);
    let acc=pieces[0];
    for(let i=1;i<pieces.length;i++){
      if(/-\s*$/.test(acc)||/\([^)]*$/.test(acc)) acc+=' ja '+pieces[i];
      else { res.push(acc); acc=pieces[i]; }
    }
    res.push(acc);
  }
  return res.map(x=>x.trim()).filter(Boolean);
}
function cleanText(t){
  return t.replace(/\r/g,'')
    .replace(/\(\s*(i{1,3}|iv|v|vi)\s*\)/gi,'')
    .replace(/(^|[\s.])(ainesosat|ingredients|ainekset|ingredienser|ainesosaluettelo)\s*:/gi,'$1')
    .replace(/(voi|saattaa)\s+sisältää[^.]*\.?/gi,'')
    .replace(/(may contain|can contain|contains traces)[^.]*\.?/gi,'')
    .replace(/(valmistettu|pakattu)[^.]*(tehtaassa|laitoksessa|tiloissa)[^.]*\.?/gi,'')
    .replace(/\b\d+([.,]\d+)?\s*%/g,'')
    .replace(/\b(min\.|vähintään|at least)\b/gi,'')
    .replace(/\.\s*(?=[A-ZÅÄÖ])/g,', ');
}
function parseItem(str){
  let s=str.trim().replace(/^[-–•·]\s*/,'').replace(/[.]+$/,'').trim();
  let classWord=null;
  const colon=s.match(/^([^:()]{2,40}):\s*(.+)$/);
  if(colon){ classWord=colon[1]; s=colon[2]; }
  const m=s.match(/^([^(\[]*?)\s*[(\[](.*)[)\]]\s*([^()\[\]]*)$/);
  let parent=s, children=[];
  if(m){
    parent=(m[1]+' '+m[3]).trim();
    const inner=m[2];
    children=splitTop(inner).map(parseItem).filter(c=>c&&(c.parent||c.children.length));
  }
  return {parent:parent.trim(), raw:str.trim(), children, classWord};
}
function detectGroup(allNorm){
  const has=w=>allNorm.some(n=>n.includes(w));
  if((has('hiiva')||has('yeast')||has('leivinjauhe'))&&(has('jauho')||has('flour'))) return 'leipa';
  if(has('kaakaovoi')||has('kaakaomassa')||has('cocoa butter')||((has('sokeri')||has('sugar'))&&(has('glukoosisiirappi')||has('glucose syrup')))) return 'makeiset';
  if((has('rypsiöljy')||has('kasviöljy')||has('kasvirasva'))&&has('vesi')&&!has('jauho')) return 'margariini';
  return 'default';
}
function pFor(e,group){ return e.p ? (e.p[group]!=null?e.p[group]:e.p.default) : 1; }
function analyze(text){
  const items=[];
  const cleaned=cleanText(text||'');
  const tops=splitTop(cleaned).map(parseItem);
  const walk=(it,depth)=>{
    const pn=normTerm(it.parent);
    const hasKids=it.children.length>0;
    if(pn&&!(hasKids&&NOCLASS.has(pn))&&!(NOCLASS.has(pn)&&!hasKids&&pn!=='emulgointiaine'&&pn!=='emulgointiaineet'&&pn!=='aromi'&&pn!=='väri'&&pn!=='väriaine')){
      const e=classifyTerm(it.parent);
      if(!hasKids||(e&&e.cls==='A')||!e) {
        if(!(hasKids&&!e)) items.push({label:it.parent.replace(/\s+/g,' ').trim(), entry:e});
      }
    }
    for(const c of it.children) walk(c,depth+1);
  };
  for(const t of tops) walk(t,0);
  // poista tyhjät ja duplikaatit
  const seen=new Set(); const uniq=[];
  for(const it of items){ const k=normTerm(it.label); if(!k||k.length<2||/^[\d.,\s]+$/.test(k)) continue; if(seen.has(k)) continue; seen.add(k); uniq.push(it); }
  const group=detectGroup(uniq.map(i=>normTerm(i.label)));
  const animals=uniq.filter(i=>i.entry&&i.entry.cls==='A');
  const uncertain=uniq.filter(i=>i.entry&&i.entry.cls==='U');
  const unknown=uniq.filter(i=>!i.entry);
  let verdict='ok', prob=null;
  if(!uniq.length) verdict='none';
  else if(animals.length) verdict='bad';
  else if(uncertain.length||unknown.length){
    verdict='warn';
    if(uncertain.length){ prob=uncertain.reduce((a,i)=>a*pFor(i.entry,group),1); }
  }
  return {items:uniq, animals, uncertain, unknown, verdict, prob, group};
}

const UNIT_RE='(g|kg|dl|l|ml|cl|rkl|tl|mm|kpl|prk|pkt|ps|pss|tlk|rs|nippu|ruukku|lehteä|lehti|viipaletta|viipale|kuppi|kuppia|cup|cups|tbsp|tsp|oz|lb|annos|annosta|pala|palaa|kynttä|kynsi|purkki|pussi|paketti|rasia|tölkki)';
const FRAC={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};
function parseNum(s){
  if(!s) return null; s=s.trim();
  for(const f in FRAC) s=s.replace(f,' '+FRAC[f]);
  const parts=s.trim().split(/\s+/); let t=0;
  for(const p of parts){ if(p.includes('/')){ const [a,b]=p.split('/'); t+=parseFloat(a)/parseFloat(b); } else t+=parseFloat(p.replace(',','.')); }
  return isNaN(t)?null:t;
}
const LINE_RE=new RegExp('^((?:\\d+(?:[.,]\\d+)?(?:\\s*[½¼¾⅓⅔])?|\\d+\\s*\\/\\s*\\d+|[½¼¾⅓⅔⅛])(?:\\s*[-–]\\s*(?:\\d+(?:[.,]\\d+)?|[½¼¾]))?)?\\s*(?:'+UNIT_RE+'\\.?(?=\\s|$))?\\s*(.*)$','i');
function normUnit(u){ if(!u) return ''; u=u.toLowerCase(); return ({purkki:'prk',pussi:'ps',paketti:'pkt',rasia:'rs',tölkki:'tlk',kuppia:'kuppi'})[u]||u; }
const STEP_HDR=/^(valmistus|valmistusohje|ohje|ohjeet|tee näin|työvaiheet|instructions|method|directions|steps)\s*:?\s*$/i;
function parseRecipe(text){
  const lines=text.replace(/\r/g,'').split('\n').map(s=>s.trim());
  let title='', servings=null, mode='ing', section='';
  const ing=[], steps=[];
  let firstContent=true;
  for(const raw of lines){
    if(!raw) continue;
    const sv=raw.match(/^(\d+)\s*(annosta|annokselle|annos|hengelle|henkilölle|henkeä|servings|portions|kpl|palaa)\b/i)||raw.match(/^(?:annoksia|annokset|servings)\s*:?\s*(\d+)/i);
    if(sv&&raw.length<40){ servings=parseInt(sv[1]); firstContent=false; continue; }
    if(STEP_HDR.test(raw)){ mode='steps'; continue; }
    if(/^.{1,40}:$/.test(raw)&&mode==='ing'){ section=raw.replace(/:$/,'').trim(); ing.push({type:'h',text:section}); firstContent=false; continue; }
    const m=raw.match(LINE_RE);
    const hasQty=m&&m[1];
    if(firstContent&&!hasQty&&raw.split(/\s+/).length<=8&&!/[.!]$/.test(raw)){ title=raw; firstContent=false; continue; }
    firstContent=false;
    if(mode==='ing'&&(hasQty||raw.split(/\s+/).length<=5)&&!/[.!]$/.test(raw)){
      let name=(m&&m[3]!=null?m[3]:raw).trim(); let note='';
      const pm=name.match(/\(([^)]*)\)/); if(pm){ note=pm[1]; name=name.replace(pm[0],'').trim(); }
      const cm=name.match(/^(.*?),\s*(.+)$/); if(cm){ note=(note+' '+cm[2]).trim(); name=cm[1]; }
      const qs=m&&m[1]?m[1]:null; let q=null,qMax=null;
      if(qs){ const r=qs.split(/[-–]/); q=parseNum(r[0]); if(r[1]) qMax=parseNum(r[1]); }
      ing.push({type:'i',raw,q,qMax,unit:normUnit(m&&m[2]),unitRaw:(m&&m[2])||'',name:name.toLowerCase(),nameRaw:name,note,section:section.toLowerCase()});
    } else {
      mode='steps';
      steps.push(raw.replace(/^\d+[.)]\s*/,''));
    }
  }
  return {title,servings,ing,steps};
}
function recipeCtx(r){
  const all=(r.title+' '+r.steps.join(' ')+' '+r.ing.map(i=>i.name||i.text).join(' ')).toLowerCase();
  const t=(r.title).toLowerCase();

  const baking=bakeWords.test(all)&&!/(lasagne|laatikko|gratiini|kiusaus|pizza)/.test(t);
  return {
    baking,
    cakey:/(kakku|piirakka|piiras|muffin|brownie|cupcake|cake|kuppikakku|sokerikakku|mokkapal|pikkuleip)/.test(all),
    omelet:/(munakas|munakokkeli|kokkeli|frittata|omeletti|omelet|quiche|tortilla espanola|piiras.*muna)/.test(t),
    meringue:/(marenki|pavlova|meringue|mousse|vaahtokarkki|macaron)/.test(all),

    frying:/(paista pannulla|pannulla|kuullota|ruskista|paista|fry|sauté)/.test(all),
    sauce:/(kastike|sauce|keitto|soup|muhennos|kastikkeen)/.test(all),

function convertRecipe(text){

  // Ohjeiden päivitys
  const sectionNames=new Map();
  for(const it of lineInfos){ const sec=it.ln.section; sectionNames.set(it, r.ing.filter(x=>x.type==='i'&&x.section===sec&&x!==it.ln).map(x=>x.name.split(' ').pop().slice(0,5))); }
  const newSteps=[];
  for(const st of r.steps){
    let s=st, mod=false;
    if(gel&&/liota|liotettu|turvota/i.test(s)&&/liivat/i.test(s)){
      s=(s.match(/[^.!]+[.!]?/g)||[s]).map(x=>x.trim()).filter(x=>!(/liivat/i.test(x)&&/liota|liotettu|turvota/i.test(x))).join(' ');
      s=(s+' Kiehauta agar-agarjauhe noin 1 dl:ssa reseptin nestettä 2 minuuttia sekoittaen ja sekoita lämpimänä muuhun seokseen. Agar hyytyy jo huoneenlämmössä.').trim();
      mod=true;
    }
    const words=[...s.matchAll(/[A-Za-zÅÄÖåäöÉé'-]+/g)];
    let result=''; let last=0;
    for(let wi=0;wi<words.length;wi++){
      const mt=words[wi]; const w=mt[0]; const lw=w.toLowerCase();
      let hit=FORM_INDEX.get(lw);
      let compound=null;
      if(!hit){
        const cm=lw.match(/^(voi|munan?|maito|maidon|kerma|kerman|juusto|liivate)(seo\w*|vaahto\w*|sula\w*|nokare\w*|raaste\w*|kastike\w*)$/);
        if(cm){ const base={voi:'butter',muna:'egg',munan:'egg',maito:'milk',maidon:'milk',kerma:'cream',kerman:'cream',juusto:'cheese',liivate:'gelatin'}[cm[1]]; hit=[{key:base,cs:'nom'}]; compound=cm[2]; }
      }
      if(!hit) continue;
      const h=hit.find(x=>usedKeys.has(x.key)); if(!h) continue;
      if(h.key==='butter'&&lw==='voi'&&!compound){
        const prev=(words[wi-1]||[''])[0].toLowerCase(), next=(words[wi+1]||[''])[0].toLowerCase();
        if(!BUTTER_CTX_PREV.has(prev)&&!BUTTER_CTX_NEXT.has(next)) continue;
      }
      const cands=usedKeys.get(h.key);
      let best=cands[0];
      if(cands.length>1){
        let bs=-1; const low=s.toLowerCase();
        for(const c of cands){ const sc=(sectionNames.get(c)||[]).filter(n=>n&&low.includes(n)).length; if(sc>bs){bs=sc;best=c;} }
      }
      const lab=best.res.label; if(!lab) continue;
      const f=inflect(lab); let rep=compound? (f.nom+compound) : f[h.cs]||f.nom;
      if(/^[A-ZÅÄÖ]/.test(w)) rep=cap(rep);
      result+=esc(s.slice(last,mt.index))+'<mark>'+esc(rep)+'</mark>'; last=mt.index+w.length; mod=true;
    }
    let html= result? result+esc(s.slice(last)) : esc(s);
    if(combo&&/(paista|kypsennä|uunissa|bake)/i.test(s)){
      const rangeRe=/(\d+)(\s*[-–]\s*)(\d+)(\s*)(min\w*)/i, singleRe=/(^|[^\d–-])(\d+)(\s*)(min\w*)/i;
      if(rangeRe.test(html)){ html=html.replace(rangeRe,(m,a,d,b,sp,u)=>`<mark>${+a+5}${d}${+b+5}</mark>${sp}${u}`); mod=true; }
      else if(singleRe.test(html)){ html=html.replace(singleRe,(m,pre,a,sp,u)=>`${pre}<mark>${+a+5}</mark>${sp}${u}`); mod=true; }
    }
    if(minceUsed&&/(ruskista|paista).*(jauheliha|kasvisjauheliha)|<mark>kasvisjauheliha/i.test(html)&&!/5–6 min/.test(html)){ html+=' <mark>Kasvisjauheliha kypsyy nopeasti: 5–6 minuuttia riittää.</mark>'; }
    if(omeletUsed&&/(paista|kypsennä|hyydy)/i.test(s)){ html+=' <mark>Paista miedolla lämmöllä 3–4 minuuttia pidempään, kunnes seos on hyytynyt.</mark>'; omeletUsed=false; mod=true; }
    newSteps.push({html,mod});
  }
  return {r,out,preSteps,newSteps,changed,combo,ctx};
}

function fmtNum(x){
  if(x==null) return '';
  if(x>=10) return String(Math.round(x));
  const w=Math.floor(x), r=x-w;
  const near=(v)=>Math.abs(r-v)<0.06;
  let fr='';
  if(near(0)) fr=''; else if(near(.25)) fr='¼'; else if(near(.5)) fr='½'; else if(near(.75)) fr='¾'; else if(near(1/3)) fr='⅓'; else if(near(2/3)) fr='⅔'; else if(near(1)) return String(w+1);
  else return (Math.round(x*10)/10).toString().replace('.',',');
  if(!w) return fr||'0';
  return fr? w+' '+fr : String(w);
}
function fmtVol(ml){
  if(ml>=1000) return fmtNum(Math.round(ml/100)/10)+' l';
  if(ml>=100){ const d=Math.round(ml/50)/2; return fmtNum(d)+' dl'; }
  if(ml>=14){ const r=Math.round(ml/7.5)/2; return fmtNum(r)+' rkl'; }
  const t=Math.max(.25,Math.round(ml/1.25)/4); return fmtNum(t)+' tl';
}
function fmtG(g){ if(g<10) return (Math.round(g*2)/2).toString().replace('.',',')+' g'; if(g<100) return Math.round(g)+' g'; return Math.round(g/5)*5+' g'; }
function fmtPart(p,ln,f){
  if(p.orig){ const q=ln.q!=null?fmtNum(ln.q*f)+(ln.qMax!=null?'–'+fmtNum(ln.qMax*f):''):''; return [(q+' '+(ln.unitRaw||'')).trim(), p.name]; }
  if(p.amt==null) return ['', p.name];
  const a=p.amt*f;
  if(p.u==='ml') return [fmtVol(a)+(p.dens?' (≈ '+fmtG(a*p.dens)+')':''), p.name];
  if(p.u==='g') return [fmtG(a)+(p.dens?' (≈ '+fmtVol(a/p.dens)+')':''), p.name];
  if(p.u==='kpl') return [fmtNum(Math.max(.25,a)), p.name];
  return [fmtNum(a), p.name];
}
let recipeState=null;
function renderRecipe(){
  const el=$('#recipeOut'); const s=recipeState; if(!s) return;
  const {conv,servings,base}=s; const f= base? servings/base : servings;
  const r=conv.r;
  const lis=[];
  for(const it of conv.out){
    if(it.type==='h'){ lis.push(`<li class="sh">${esc(it.text)}</li>`); continue; }
    if(it.type==='keep'){ const ln=it.ln; const q=ln.q!=null?fmtNum(ln.q*f)+(ln.qMax!=null?'–'+fmtNum(ln.qMax*f):''):''; lis.push(`<li><span class="amt">${esc((q+' '+ln.unitRaw).trim())}</span><span class="nm">${esc(ln.nameRaw)}${ln.note?' <span class="why">('+esc(ln.note)+')</span>':''}</span></li>`); continue; }
    if(it.type==='removed'){ lis.push(`<li class="sub removed"><span class="nm"><b>Poistettu: ${esc(it.ln.raw)}</b><span class="why">Korvaussääntö puuttuu, kirjattu ylläpidolle.</span></span></li>`); continue; }
    const ln=it.ln; const parts=(it.type==='add'?it.parts:it.res.parts).map(p=>{ const [a,n]=fmtPart(p,ln||{},f); return `<div><span class="amt">${esc(a)}</span><span>${esc(n)}</span></div>`; }).join('');
    const why= it.type==='add'? it.why : (it.res.why||'');
    lis.push(`<li class="sub"><span class="nm"><span class="leaf">${ICON.leaf}${it.type==='add'?'Lisätty':'Korvattu'}</span><span class="parts">${parts}</span>${ln?`<span class="was">${esc(ln.raw)}</span>`:''}${why?`<span class="why">${esc(why)}</span>`:''}</span></li>`);
  }
  const steps=[...conv.preSteps.map(p=>`<li class="pre"><div>${esc(p)}</div></li>`), ...conv.newSteps.map(st=>`<li class="${st.mod?'mod':''}"><div>${st.html}</div></li>`)].join('');
  el.innerHTML=`
    <div class="rhead">${r.title?`<h2 class="rtitle">${esc(r.title)}</h2>`:''}</div>
    ${conv.changed?`<div class="banner brand">${ICON.leaf}<span>Vegaaninen versio</span></div>`:`<div class="banner ok">${ICON.ok}<span>Resepti on jo vegaaninen</span></div>`}

    <ul class="rlist">${lis.join('')}</ul>
    ${steps?`<h2>Valmistus</h2><ol class="steps">${steps}</ol>`:''}
    <button class="btn outline block" id="editRecipe">Muokkaa reseptiä</button>`;
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ const d=+b.dataset.d; if(base){ s.servings=Math.max(1,s.servings+d); } else { s.servings=Math.max(.5,s.servings+d*.5); } renderRecipe(); });
  $('#editRecipe').onclick=()=>{ $('#recipeOut').hidden=true; $('#recipeEdit').hidden=false; };
}

async function shrink(file,max){ const img=await loadImage(file); const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); const x=c.getContext('2d'); x.filter='grayscale(1) contrast(1.25)'; x.drawImage(img,0,0,c.width,c.height); return c; }

function validEan(s){ s=String(s||'').replace(/\D/g,''); if(![8,12,13,14].includes(s.length)) return null; const d=s.split('').map(Number); const chk=d.pop(); let sum=0; d.reverse().forEach((x,i)=>sum+=x*(i%2===0?3:1)); return (10-sum%10)%10===chk? s : null; }
function loadImage(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image(); img.onload=()=>{ res(img); setTimeout(()=>URL.revokeObjectURL(url),1000); }; img.onerror=rej; img.src=url; }); }
function zxingDecode(canvas){
  if(!window.ZXing) return null;
  const Z=window.ZXing;
  const ctx=canvas.getContext('2d'); const {width:w,height:h}=canvas; const d=ctx.getImageData(0,0,w,h).data;
  const lum=new Uint8ClampedArray(w*h); for(let i=0,j=0;i<lum.length;i++,j+=4) lum[i]=(d[j]*299+d[j+1]*587+d[j+2]*114)/1000;
  const hints=new Map(); hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]); hints.set(Z.DecodeHintType.TRY_HARDER,true);
  const reader=new Z.MultiFormatReader(); reader.setHints(hints);
  for(const Bin of [Z.HybridBinarizer,Z.GlobalHistogramBinarizer]){
    try{ const src=new Z.RGBLuminanceSource(lum,w,h); const bmp=new Z.BinaryBitmap(new Bin(src)); const r=reader.decode(bmp); if(r) return r.getText(); }catch{}
  }
  return null;
}
async function decodeBarcode(file){
  const img=await loadImage(file);
  for(const max of [1400,900]){
    for(const rot of [0,90]){
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
      const c=document.createElement('canvas'); const x=c.getContext('2d');
      if(rot){ c.width=h; c.height=w; x.translate(h/2,w/2); x.rotate(Math.PI/2); x.drawImage(img,-w/2,-h/2,w,h); } else { c.width=w; c.height=h; x.drawImage(img,0,0,w,h); }
      const t=zxingDecode(c); if(t&&validEan(t)) return validEan(t);
    }
  }
  const s=await getSample();
  if(s){ try{ const j=await s.json('Kuvassa on tuotteen viivakoodi. Lue viivakoodin alla oleva numerosarja (EAN-13, EAN-8, UPC-A tai UPC-E). Vastaa pelkkänä JSON-oliona: {"ean": string|null}',{images:[file],modelTier:'quick'}); const v=validEan(j&&j.ean); if(v) return v; }catch{} }
  return null;
}

let liveFailed=false, camStream=null, camTimer=null;
function stopLive(){ clearTimeout(camTimer); camTimer=null; if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } $('#camVideo').srcObject=null; $('#cam').hidden=true; }
async function startLive(){
  const v=$('#camVideo'); $('#cam').hidden=false;
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    v.srcObject=camStream; await v.play();
  }catch(err){ stopLive(); liveFailed=true; $('#scanOut').innerHTML='<div class="err">Kameraa ei saatu auki. Salli kameran käyttö tai napauta uudelleen ottaaksesi kuvan.</div>'; return; }
  const c=document.createElement('canvas'); const x=c.getContext('2d',{willReadFrequently:true});
  const tick=()=>{
    if(!camStream) return;
    const vw=v.videoWidth, vh=v.videoHeight;
    if(vw&&vh){
      const cw=Math.round(vw*.8), ch=Math.round(Math.min(vh*.5,cw*.6));
      const sc=Math.min(1,900/cw); c.width=Math.round(cw*sc); c.height=Math.round(ch*sc);
      x.drawImage(v,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,c.width,c.height);
      const t=zxingDecode(c); const ean=t&&validEan(t);
      if(ean){ stopLive(); $('#eanInput').value=ean; showProduct(ean); return; }
    }
    camTimer=setTimeout(tick,120);
  };
  tick();
}
$('#camClose').onclick=stopLive;
$('.scanbtn').addEventListener('click',e=>{
  if(STANDALONE&&!liveFailed&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.ZXing){ e.preventDefault(); startLive(); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&camStream) stopLive(); });
$('#barcodeInput').addEventListener('change',async e=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  const out=$('#scanOut'); out.innerHTML='<div class="status"><span class="spin"></span>Tunnistetaan viivakoodia…</div>';
  try{ const ean=await decodeBarcode(file); if(ean){ $('#eanInput').value=ean; showProduct(ean); } else out.innerHTML='<div class="err">Viivakoodia ei tunnistettu. Kuvaa viivakoodi suoraan edestä tai kirjoita numerot.</div>'; }
  catch{ out.innerHTML='<div class="err">Kuvaa ei voitu avata. Yritä uudelleen.</div>'; }
});
function lookupEan(){ const v=validEan($('#eanInput').value); if(!v){ $('#scanOut').innerHTML='<div class="err">Tarkista numero: viivakoodissa on 8, 12 tai 13 numeroa.</div>'; return; } showProduct(v); }
$('#eanBtn').onclick=lookupEan;
$('#eanInput').addEventListener('keydown',e=>{ if(e.key==='Enter') lookupEan(); });
function productItems(limit){
  const p=products(); return Object.entries(p).sort((a,b)=>b[1].ts-a[1].ts).slice(0,limit).map(([ean,d])=>{
    const a=analyze(d.ingredients||''); const v=a.verdict==='none'?'warn':a.verdict;
    const when=new Date(d.ts).toLocaleDateString('fi-FI',{day:'numeric',month:'numeric'});
    return `<li><button class="pitem" data-ean="${esc(ean)}">${verdictBadge(v)}<span class="tx"><b>${esc(d.name||ean)}</b><span>${WORD[v]} · ${when}</span></span></button></li>`;
  }).join('');
}
function renderRecent(){ const html=productItems(8); $('#recent').innerHTML=html; $('#recentWrap').hidden=!html; bindPItems($('#recent')); }
function bindPItems(root){ root.querySelectorAll('.pitem').forEach(b=>b.onclick=()=>{ closeSheet(); go('skannaa'); $('#eanInput').value=b.dataset.ean; showProduct(b.dataset.ean); window.scrollTo({top:0}); }); }
renderRecent();

// --- Valikko: tallennetut tuotteet ja puuttuvat säännöt
function openSheet(){
  const n=Object.keys(products()).length; $('#prodCount').textContent='Tuotteet ('+n+')';
  $('#allProducts').innerHTML=productItems(500)||'<li class="empty">Ei tallennettuja tuotteita.</li>'; bindPItems($('#allProducts'));
  const g=loadGaps(); $('#gapCount').textContent='Puuttuvat korvaussäännöt ja tuntemattomat ainesosat ('+g.length+')';
  $('#gapList').innerHTML=g.slice().reverse().map(x=>`<li><span>${esc(x.term)}</span><span>${esc(x.type.replace(' reseptin ainesosa',''))}</span></li>`).join('')||'<li class="empty" style="background:none;padding:0">Ei puutteita.</li>';
  $('#clearGaps').hidden=!g.length;
  $('#sheet').hidden=false;
}
function closeSheet(){ $('#sheet').hidden=true; }
$('#moreBtn').onclick=openSheet; $('#sheetClose').onclick=closeSheet;
$('#sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(); });
$('#clearGaps').onclick=()=>{ saveGaps([]); openSheet(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

// --- Välilehdet
const TABS=['skannaa','ainesosat','resepti'];
function go(t){
  if(!TABS.includes(t)) t='ainesosat';
  for(const x of TABS){ $('#v-'+x).hidden=x!==t; }
  document.querySelectorAll('.tab').forEach(b=>b.toggleAttribute('aria-current',false)||(b.dataset.tab===t&&b.setAttribute('aria-current','page')));
  try{ if(location.hash!=='#'+t) history.replaceState(null,'','#'+t); }catch{}
  store.set('vegan.tab',t);
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ go(b.dataset.tab); window.scrollTo({top:0}); });
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1)||store.get('vegan.tab','ainesosat'));
if(STANDALONE&&'serviceWorker' in navigator&&location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
